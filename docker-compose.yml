# Развёртывание одним файлом: база, подготовка схемы, API, консоль за Caddy.
#
#   cp .env.docker.example .env.docker && отредактировать
#   docker compose --env-file .env.docker up -d
#
# Мобильное приложение ходит на тот же адрес, что и консоль (/api/*).
#
# Образы берутся из реестра, если заданы QUIZZY_IMAGE_PREFIX и QUIZZY_VERSION,
# и собираются на месте, если нет (`docker compose up --build`). Один образ на
# api, provision и transcriber — это один и тот же код; три образа означали бы
# три версии одного приложения, способные разъехаться между собой.
#
# Ролей две, и это не педантизм. Владелец базы (quizzy) нужен миграциям —
# им требуются права на схему. Приложение подключается ролью quizzy_app,
# которая таблицами не владеет: владелец в PostgreSQL обходит политики
# строк, и с ним все сорок семь политик остаются на месте, но каждый видит
# всё. Отличить это от исправной работы нельзя ничем — запросы отрабатывают,
# экраны рисуются. Сервер в production такой запуск не примет и скажет
# почему.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: quizzy
      POSTGRES_USER: quizzy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quizzy"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Одноразовая подготовка: миграции и роль приложения. Владельцем базы.
  provision:
    image: ${QUIZZY_IMAGE_PREFIX:-quizzy}/api:${QUIZZY_VERSION:-local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["bun", "apps/api/src/provision.ts"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://quizzy:${POSTGRES_PASSWORD}@postgres:5432/quizzy
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?задайте APP_DB_PASSWORD}
      # подготовке он не нужен, но конфигурация процесса проверяется целиком
      # на старте — и это правильно: половинчатая проверка пропускает как раз
      # ту переменную, которой не хватит потом
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${QUIZZY_IMAGE_PREFIX:-quizzy}/api:${QUIZZY_VERSION:-local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      # роль приложения, а не владелец: см. пояснение вверху файла
      DATABASE_URL: postgres://quizzy_app:${APP_DB_PASSWORD}@postgres:5432/quizzy
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?задайте JWT_SECRET (32+ символов)}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      ANSWER_EVENTS_RETENTION_DAYS: ${ANSWER_EVENTS_RETENTION_DAYS:-365}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-Quizzy <noreply@localhost>}
      CONSOLE_URL: ${CONSOLE_URL:-}
      INSTITUTION_NAME: ${INSTITUTION_NAME:-}
      INSTITUTION_UNIT: ${INSTITUTION_UNIT:-}
      PORT: "3001"
      RECORDINGS_DIR: /data/recordings
    volumes:
      # тот же том, что у расшифровщика: API кладёт аудио, воркер его читает
      - recordings:/data/recordings
    depends_on:
      postgres:
        condition: service_healthy
      # схема и роль должны существовать до первого запроса
      provision:
        condition: service_completed_successfully

  # Загрузка модели распознавания. Одноразовая: модель весит сотни мегабайт и
  # живёт в томе, а не в образе — образ иначе пришлось бы качать целиком при
  # каждой выкатке, а модель меняется раз в год.
  whisper-model:
    image: curlimages/curl:latest
    restart: "no"
    user: root
    environment:
      MODEL: ${WHISPER_MODEL_NAME:-small}
    volumes:
      - models:/models
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        f="/models/ggml-$${MODEL}.bin"
        if [ -s "$$f" ]; then echo "модель уже на месте: $$f"; exit 0; fi
        echo "качаю модель $${MODEL}…"
        curl -fL --retry 3 -o "$$f.part" \
          "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-$${MODEL}.bin"
        mv "$$f.part" "$$f"
        echo "готово: $$f"

  # Расшифровка — отдельным процессом, а не внутри API.
  #
  # Расшифровка часового приёма занимает минуты, иногда десятки минут, и
  # рядом в том же процессе обслуживаются запросы специалистов: «консоль
  # подтормаживает после обеда» — это и есть очередь расшифровок изнутри
  # кабинета. Отдельный контейнер к тому же можно ограничить по процессору,
  # не трогая отзывчивость консоли.
  transcriber:
    image: ${QUIZZY_IMAGE_PREFIX:-quizzy}/api:${QUIZZY_VERSION:-local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["bun", "apps/api/src/transcriber.ts"]
    restart: unless-stopped
    # Проверка здоровья из образа стучится в HTTP приложения, которого у
    # воркера нет: контейнер вечно «unhealthy». Постоянно ложная тревога
    # хуже её отсутствия — на неё перестают смотреть, и вместе с ней
    # перестают смотреть на настоящие.
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgres://quizzy_app:${APP_DB_PASSWORD}@postgres:5432/quizzy
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      RECORDINGS_DIR: /data/recordings
      WHISPER_BIN: /usr/local/bin/whisper-cli
      WHISPER_MODEL: /models/ggml-${WHISPER_MODEL_NAME:-small}.bin
      # планировщик живёт в api: два тика на одну базу выдали бы задания дважды
      SCHEDULER_ENABLED: "0"
    volumes:
      - recordings:/data/recordings
      - models:/models
    deploy:
      resources:
        limits:
          cpus: ${TRANSCRIBER_CPUS:-2}
    depends_on:
      postgres:
        condition: service_healthy
      provision:
        condition: service_completed_successfully
      whisper-model:
        condition: service_completed_successfully

  web:
    image: ${QUIZZY_IMAGE_PREFIX:-quizzy}/web:${QUIZZY_VERSION:-local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      # домен для автоматического TLS; пусто — http на :80
      SITE_ADDRESS: ${SITE_ADDRESS:-}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    depends_on:
      - api

volumes:
  pgdata:
  recordings:
  models:
