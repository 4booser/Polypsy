# Выкатка на сервер учреждения.
#
# Собираем образы здесь, на сервере — только скачивание и перезапуск. Сборка
# на самом сервере выглядит проще, но означает, что при ошибке сборки сервис
# уже остановлен, а машина занята компиляцией whisper.cpp вместо приёма.
#
# Откат — переключением тега: образы остаются в реестре, и вернуться на
# предыдущий выпуск можно за время скачивания.
name: Выкатка

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Тег или коммит для выкатки"
        required: true

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # Тесты идут перед сборкой намеренно: собранный, но не проверенный образ
  # в реестре — это приглашение выкатить его руками «по-быстрому».
  check:
    uses: ./.github/workflows/ci.yml

  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prefix: ${{ steps.meta.outputs.prefix }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      # Версия — то, что выкатываем, а не то, откуда запущено.
      #
      # При пуше тега это одно и то же. При ручном запуске (workflow_dispatch —
      # так же запускает откат из техпанели) GITHUB_REF_NAME — ветка, с которой
      # взят сам рабочий процесс, то есть «main»: образы вышли бы с тегом
      # «main», в .env.docker легла бы версия «main», и история выкаток в
      # техпанели записала бы откат на v1.2.0 как выпуск «main». Поэтому при
      # ручном запуске версия — введённый тег.
      #
      # Коммит — из того, что реально выгружено (git rev-parse), а не
      # github.sha: при ручном запуске github.sha — вершина main, а собирается
      # введённый тег.
      #
      # Введённое значение приходит через env, а не подстановкой в текст
      # сценария: подстановка ${{ }} вставила бы его в bash как есть.
      - id: meta
        name: Версия и адрес образов
        env:
          INPUT_REF: ${{ github.event.inputs.ref }}
        run: |
          ref="${INPUT_REF:-$GITHUB_REF_NAME}"
          echo "version=${ref#refs/tags/}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # имя владельца и репозитория приводится к строчным: реестр не
          # принимает заглавные, а «4booser/Quizzy» их содержит — сборка
          # падала на самом последнем шаге, уже после всех проверок
          echo "prefix=$(echo "${{ env.REGISTRY }}/${{ github.repository }}" | tr "[:upper:]" "[:lower:]")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Образ API несёт и сервер, и расшифровщик, и подготовку базы: это один
      # и тот же код, и три образа означали бы три версии одного приложения,
      # способные разъехаться между собой.
      - name: Образ API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}/api:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.prefix }}/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Образ консоли
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}/web:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.prefix }}/web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      # чтобы сервер вошёл в реестр токеном этого прогона
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Ключ доступа к серверу
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # отпечаток берётся из секрета, а не с сервера: ssh-keyscan на живом
          # соединении принимает любой ключ, то есть и подменённый
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # Снимок базы ДО миграций. Миграции не откатываются переключением тега:
      # схема уже изменена, и старый образ на новую схему не встанет.
      #
      # Через systemd, а не напрямую: там уже лежат адрес базы, каталог
      # копий и парольная фраза. Второй список тех же значений в секретах
      # означал бы два места, которые однажды разойдутся.
      - name: Снимок базы
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "systemctl start quizzy-backup.service"

      # Вход в реестр — токеном этого прогона, а не хранимым на сервере.
      # Постоянный токен в файле у root живёт до тех пор, пока о нём не
      # забудут, а забывают о таких сразу.
      - name: Вход сервера в реестр
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "docker login ghcr.io -u ${{ github.actor }} --password-stdin"

      # Кроме версии, на сервер едут коммит, кто запустил выкатку, ссылка на
      # прогон и репозиторий: по ним API при старте записывает выпуск в историю
      # (раздел «Випуски» техпанели, apps/api/src/lib/releases.ts). Кто — это
      # triggering_actor: человек, запустивший именно эту попытку; при
      # перезапуске упавшей выкатки им будет перезапустивший, а не автор тега.
      - name: Выкатка
        env:
          VERSION: ${{ needs.build.outputs.version }}
          PREFIX: ${{ needs.build.outputs.prefix }}
          SHA: ${{ needs.build.outputs.sha }}
          ACTOR: ${{ github.triggering_actor || github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          # Второе имя того же сайта. Предел выдачи сертификатов Let's Encrypt
          # считается на ТОЧНЫЙ набор имён: набор из двух — отдельный счётчик,
          # и выбранный предел на одно имя перестаёт держать сайт лежащим до
          # конца недели. Добавляется только к домену второго уровня — у
          # «www.чего-то» вышло бы «www.www».
          #
          # Условие завершается `|| true` не для красоты: шаг выполняется
          # через `bash -e`, и `[ … ] && …` с ложным условием возвращает
          # ненулевой код — то есть на домене третьего уровня выкатка падала
          # бы прямо здесь, ничего не выкатив.
          ALIASES=""
          host="${{ secrets.SITE_ADDRESS }}"
          dots=$(printf '%s' "$host" | tr -cd . | wc -c | tr -d ' ')
          if [ "$dots" = "1" ]; then ALIASES="www.$host"; fi
          # Описание состава уезжает на сервер вместе с образами.
          #
          # Раньше не уезжало вовсе: на сервере лежала копия, сделанная руками
          # при первичной настройке, и любая правка docker-compose.yml в
          # хранилище до продакшена не доходила в принципе. Обнаружилось это
          # худшим из возможных способов — через выкатку, которая проходила
          # зелёной и не меняла ничего, дважды подряд.
          #
          # Прежний файл сохраняется рядом с отметкой времени: если на сервере
          # были правки руками, они не исчезают молча, а остаются под именем,
          # по которому их видно.
          scp -i ~/.ssh/id_ed25519 docker-compose.yml \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/docker-compose.new.yml"
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "VERSION='$VERSION' PREFIX='$PREFIX' SHA='$SHA' ACTOR='$ACTOR' RUN_URL='$RUN_URL' REPO='$REPO' ALIASES='$ALIASES' MAIL='${{ secrets.ACME_EMAIL }}' TARGET='${{ secrets.VPS_PATH }}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$TARGET"

          if ! cmp -s /tmp/docker-compose.new.yml docker-compose.yml; then
            cp docker-compose.yml "docker-compose.yml.$(date +%Y%m%d-%H%M%S).bak"
            cp /tmp/docker-compose.new.yml docker-compose.yml
            echo "состав обновлён, прежний сохранён рядом"
          fi
          rm -f /tmp/docker-compose.new.yml

          # версия и адрес образов живут в .env.docker, а не в переменных
          # оболочки: перезапуск сервера не должен откатывать выкатку.
          #
          # QUIZZY_COMMIT, QUIZZY_DEPLOYED_BY, QUIZZY_RUN_URL, QUIZZY_REPO — для
          # истории выкаток. До контейнера api они доезжают только потому, что
          # docker-compose.yml объявляет их в environment: переменная, записанная
          # сюда и не объявленная там, в контейнере пропадает (так уже было с
          # SITE_ALIASES). Доехали ли — проверяет шаг «Настройка доехала до
          # контейнера» ниже.
          for kv in "QUIZZY_IMAGE_PREFIX=$PREFIX" "QUIZZY_VERSION=$VERSION" "QUIZZY_COMMIT=$SHA" "QUIZZY_DEPLOYED_BY=$ACTOR" "QUIZZY_RUN_URL=$RUN_URL" "QUIZZY_REPO=$REPO" "SITE_ALIASES=$ALIASES" "ACME_EMAIL=$MAIL"; do
            k="${kv%%=*}"
            grep -q "^$k=" .env.docker               && sed -i "s|^$k=.*|$kv|" .env.docker               || echo "$kv" >> .env.docker
          done
          # Новые секреты заводятся НА СЕРВЕРЕ и только если их там нет.
          #
          # PHONE_INDEX_SECRET и EXPORT_SECRET появились вместе с разведением
          # секретов: пока слепой индекс телефона и код субъекта сидели на
          # JWT_SECRET, ротация подписи — штатная реакция на утечку токена —
          # молча ломала дедупликацию телефонов и склейку данных
          # исследования. Без них compose теперь не стартует вовсе.
          #
          # Генерируются здесь, а не передаются снаружи: значение, прошедшее
          # через хранилище секретов и журнал выкатки, — это ещё одно место,
          # где оно может утечь. И только при отсутствии: перезапись
          # EXPORT_SECRET сделала бы несравнимыми коды субъекта в уже
          # отданных выгрузках, а перезапись PHONE_INDEX_SECRET потребовала
          # бы пересчёта отпечатков.
          #
          # ENCRYPTION_KEY здесь НЕ трогается намеренно. Перезапись сделала бы
          # нечитаемыми все зашифрованные записи — это потеря данных, а не
          # настройка. Если его нет, compose остановится с внятным
          # сообщением, прежние контейнеры продолжат работать, и человек
          # впишет ключ сам, зная, что делает.
          for k in PHONE_INDEX_SECRET EXPORT_SECRET; do
            grep -q "^$k=.\+" .env.docker || {
              echo "$k=$(openssl rand -base64 32 | tr -d '\n')" >> .env.docker
              echo "заведён $k (не было)"
            }
          done

          docker compose --env-file .env.docker pull
          # provision отрабатывает до api: миграции и права роли приложения
          docker compose --env-file .env.docker up -d
          docker image prune -f --filter "until=168h"
          docker logout ghcr.io
          REMOTE

      # Каталог ставится ПОСЛЕ подъёма, а не вместе с миграциями.
      #
      # Это наполнение, а не схема: методика каталога — обычная запись,
      # к которой привязываются прохождения. Смешать её с provision значило
      # бы, что повторный прогон миграций трогает данные, а откат схемы
      # задевает методики, по которым уже кого-то обследовали.
      #
      # Установщик идемпотентен: уже поставленную методику узнаёт по
      # catalog_key и не трогает — ни текста пунктов, ни порогов. Поэтому
      # шаг стоит на каждом выкате и ничего не портит.
      - name: Установка общего каталога
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd ${{ secrets.VPS_PATH }} && docker compose --env-file .env.docker run --rm --no-deps api bun apps/api/src/installCatalog.ts"

      # Проверяем не «контейнер поднялся», а «приложение отвечает»: поднявшийся
      # контейнер с упавшим внутри процессом выглядит успешной выкаткой.
      #
      # Спрашивается приложение ИЗНУТРИ сервера, а не через публичный адрес.
      #
      # Через публичный адрес спрашивать нельзя: между проверкой и приложением
      # стоит TLS, и сломанный сертификат отвечает ровно тем же, чем упавшее
      # приложение, — молчанием. Так и вышло: сертификат не выдался по пределу
      # Let's Encrypt, а выкатка сообщила «приложение не ответило за 150
      # секунд», хотя приложение всё это время отдавало 200 на тот же путь.
      # Проверка, называющая не того виновника, хуже отсутствующей: по ней
      # чинят не то.
      # Настройка проверяется В КОНТЕЙНЕРЕ, а не в файле на сервере.
      #
      # Ровно здесь и была потеряна половина вечера: имя сайта доезжало до
      # .env.docker и там останавливалось — сначала потому, что compose не
      # объявлял переменную, потом потому, что сам compose на сервер не
      # копировался. Обе выкатки прошли зелёными и не изменили ничего, а
      # искать приходилось с начала цепи, потому что сообщить о разрыве было
      # некому.
      #
      # Сравнение идёт на сервере, наружу выходит только «совпало» или нет:
      # адрес сайта — секрет, и печатать его в журнал незачем.
      #
      # Версия и коммит проверяются в контейнере api тем же способом: без них
      # история выкаток в техпанели молча перестаёт пополняться, и узнают об
      # этом через месяц, открыв пустой раздел.
      - name: Настройка доехала до контейнера
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          ALIASES=""
          host="${{ secrets.SITE_ADDRESS }}"
          dots=$(printf '%s' "$host" | tr -cd . | wc -c | tr -d ' ')
          if [ "$dots" = "1" ]; then ALIASES="www.$host"; fi
          out=$(ssh -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "WANT_A='$host' WANT_L='$ALIASES' WANT_V='$VERSION' WANT_C='$SHA' TARGET='${{ secrets.VPS_PATH }}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$TARGET"
          got_a=$(docker compose --env-file .env.docker exec -T web printenv SITE_ADDRESS 2>/dev/null || true)
          got_l=$(docker compose --env-file .env.docker exec -T web printenv SITE_ALIASES 2>/dev/null || true)
          [ "$(printf '%s' "$got_a" | tr -d '\r')" = "$WANT_A" ] && echo "адрес: совпал" || echo "адрес: НЕ ДОЕХАЛ"
          [ "$(printf '%s' "$got_l" | tr -d '\r')" = "$WANT_L" ] && echo "имена: совпали" || echo "имена: НЕ ДОЕХАЛИ"
          got_v=$(docker compose --env-file .env.docker exec -T api printenv QUIZZY_VERSION 2>/dev/null || true)
          got_c=$(docker compose --env-file .env.docker exec -T api printenv QUIZZY_COMMIT 2>/dev/null || true)
          [ "$(printf '%s' "$got_v" | tr -d '\r')" = "$WANT_V" ] && echo "версия: совпала" || echo "версия: НЕ ДОЕХАЛА"
          [ "$(printf '%s' "$got_c" | tr -d '\r')" = "$WANT_C" ] && echo "коммит: совпал" || echo "коммит: НЕ ДОЕХАЛ"
          REMOTE
          )
          echo "$out"
          echo "$out" | grep -q "НЕ ДОЕХАЛ" && { echo "настройка не дошла до контейнера — смотрите docker-compose.yml на сервере"; exit 1; }
          exit 0

      - name: Проверка приложения
        run: |
          ok=""
          for i in $(seq 1 30); do
            code=$(ssh -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
              "cd ${{ secrets.VPS_PATH }} && docker compose --env-file .env.docker exec -T api bun -e 'fetch(\"http://localhost:3001/health/ready\").then(r=>console.log(r.status)).catch(()=>console.log(0))'" || true)
            [ "$code" = "200" ] && ok="да" && break
            sleep 5
          done
          if [ -z "$ok" ]; then
            echo "приложение не ответило за 150 секунд"
            ssh -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
              "cd ${{ secrets.VPS_PATH }} && docker compose --env-file .env.docker logs --tail 80 api"
            exit 1
          fi
          echo "приложение отвечает"

      # Отдельным шагом, потому что это отдельная неисправность: приложение
      # может быть цело, а снаружи недоступно. Шаг не валит выкатку — код уже
      # на сервере и работает, — но говорит вслух, что снаружи сайта нет, и
      # приносит логи того, кто за это отвечает.
      - name: Доступность снаружи
        run: |
          for i in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "https://${{ secrets.SITE_ADDRESS }}/health/ready" || true)
            [ "$code" = "200" ] && echo "сайт отвечает по https" && exit 0
            sleep 5
          done
          echo "::warning::приложение работает, но снаружи по https не отвечает — смотрите сертификат"
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd ${{ secrets.VPS_PATH }} && docker compose --env-file .env.docker logs --tail 60 web"
