name: CI

on:
  # Ветку PR проверяет событие pull_request, push — только main. Прежде
  # каждый коммит в ветку PR гонял всю сюиту дважды (push и pull_request на
  # один и тот же коммит): вдвое дольше ждать и вдвое больше шансов поймать
  # случайный сбой — красной считалась ветка, где упал любой из двух. Теги
  # проверяет выкатка: deploy.yml зовёт этот же файл (workflow_call).
  push:
    branches: [main]
  pull_request:
  # чтобы выкатка могла позвать те же проверки, а не свою копию:
  # две копии однажды разойдутся, и разойдётся именно та, что перед боем
  workflow_call:
    inputs:
      # Что проверять — коммит, который выкатка соберёт (#161). Без него
      # вызванный процесс выгружал ref вызвавшего: при ручной выкатке и
      # откате из техпанели это main, а собирался введённый тег — тесты
      # шли не на том коде, что уезжал на сервер, а откат на исправный тег
      # вставал, пока main красный. Пусто (пуш, PR) — как раньше.
      ref:
        type: string
        required: false
        default: ""

# Новый коммит в PR отменяет проверку прошлого: её итог уже никому не нужен.
# Пуш в main и вызов из выкатки не отменяются никогда — у каждого прогона
# своя группа (run_id), а у выкатки своя очередь (deploy.yml, группа deploy).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: quizzy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # История целиком, с тегами: test/migrationJournal.test.ts сверяет журнал
      # миграций с последним выпуском и с каждым состоянием main после него —
      # миграция, влитая перед уже существующими, молча обходит базы, стоявшие
      # в промежутке (0096 после 0097/0098, внешний разбор 2026-09-28).
      # На обрезанной истории эта проверка отказывает, а не пропускается.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Установка зависимостей
        run: bun install --frozen-lockfile

      - name: Линтер
        run: bun run lint

      - name: Типы — API
        run: bunx tsc --noEmit
        working-directory: apps/api
      - name: Типы — веб
        run: bunx tsc --noEmit
        working-directory: apps/web
      - name: Типы — мобилка
        run: bunx tsc --noEmit
        working-directory: apps/mobile

      # Срок теста — 30 с вместо 5 по умолчанию bun. Пять секунд — не
      # обещание скорости, а случайное число: на раннере CI под ролью
      # приложения проходы по всей зоне (аналитика, очереди, страницы
      # курсором) их переходили, и сюита краснела без единой ошибки в коде —
      # пять из 27 красных прогонов с 7 октября. Скорость, где она важна,
      # проверяют свои тесты с явными порогами (dynamicsScale, rlsScale).
      # Тот же срок — в скриптах test и test:app-role (package.json).
      - name: Тесты
        run: bun test --timeout 30000
        env:
          DATABASE_URL: postgres://postgres@localhost:5432/quizzy

      # Сюита выше ходит в базу владельцем, а владелец политики строк обходит:
      # три боевые поломки волны 12 и полтора десятка волны 13 были видны
      # только под ролью приложения. Здесь часть сюиты — пути пациента и
      # сотрудника — гоняется ещё раз так, что каждый запрос к приложению
      # идёт ролью без прав владельца (QUIZZY_TEST_APP_ROLE=1,
      # test/appRole.ts). Не вся сюита: техпанель и отчёты о самой базе
      # (ops, opsSec) проверяют ответы владельца намеренно, а синтетические
      # очереди (alertQueue) заводят случаи без прохождений, которых в бою
      # не бывает. Около четверти времени основной сюиты, а не её удвоение.
      # Список файлов — в скрипте test:app-role (apps/api/package.json);
      # новый файл про пути пациента или сотрудника — дописывать туда.
      - name: Тесты под ролью приложения (политики строк)
        run: bun run --cwd apps/api test:app-role
        env:
          DATABASE_URL: postgres://postgres@localhost:5432/quizzy

      - name: Внешняя копия — сценарий на заглушке S3
        run: ./scripts/test/offsite-roundtrip.sh

      - name: Целостность контента в базе
        run: bun run --cwd apps/api db:migrate && bun run --cwd apps/api db:seed && bun run --cwd apps/api content:check
        env:
          DATABASE_URL: postgres://postgres@localhost:5432/quizzy

      - name: Сборка консоли
        run: bun run build
        working-directory: apps/web

  e2e:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16.15@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Установка зависимостей
        run: bun install --frozen-lockfile
      - name: Браузер для смоука
        run: bunx playwright install --with-deps chromium

      - name: Смоук веб-консоли
        run: bunx playwright test
        env:
          E2E_DATABASE_URL: postgres://postgres@localhost:5432/quizzy_e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      # Состав разбирается здесь, а не впервые на сервере: повтор ключа в
      # environment (так встала выкатка v1.11.1) compose отвергает целиком,
      # и узнавать об этом на шаге «docker compose up» — поздно. Секреты —
      # заглушки: проверяется разбор файла, а не значения.
      - name: Состав docker-compose разбирается
        run: docker compose -f docker-compose.yml config -q
        env:
          JWT_SECRET: ci-placeholder
          ENCRYPTION_KEY: ci-placeholder
          PHONE_INDEX_SECRET: ci-placeholder
          EXPORT_SECRET: ci-placeholder
          SEARCH_INDEX_SECRET: ci-placeholder
          APP_DB_PASSWORD: ci-placeholder
          POSTGRES_PASSWORD: ci-placeholder
      - name: Сборка образа API
        run: docker build -f apps/api/Dockerfile .
      - name: Сборка образа консоли
        run: docker build -f apps/web/Dockerfile .
