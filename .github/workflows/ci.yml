name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: quizzy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Установка зависимостей
        run: bun install --frozen-lockfile

      - name: Линтер
        run: bun run lint

      - name: Типы — API
        run: bunx tsc --noEmit
        working-directory: apps/api
      - name: Типы — веб
        run: bunx tsc --noEmit
        working-directory: apps/web
      - name: Типы — мобилка
        run: bunx tsc --noEmit
        working-directory: apps/mobile

      - name: Тесты
        run: bun test
        env:
          DATABASE_URL: postgres://postgres@localhost:5432/quizzy

      - name: Сборка консоли
        run: bun run build
        working-directory: apps/web

  e2e:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Установка зависимостей
        run: bun install --frozen-lockfile
      - name: Браузер для смоука
        run: bunx playwright install --with-deps chromium

      - name: Смоук веб-консоли
        run: bunx playwright test
        env:
          E2E_DATABASE_URL: postgres://postgres@localhost:5432/quizzy_e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Сборка образа API
        run: docker build -f apps/api/Dockerfile .
      - name: Сборка образа консоли
        run: docker build -f apps/web/Dockerfile .
