# Обслуживание живого экземпляра.
#
# Запускается только руками, с выбором действия из списка. Списком, а не
# строкой команды: доступ к серверу учреждения через кнопку в вебе — это
# выполнение произвольного кода на машине с медицинскими данными, и
# единственное, что отличает обслуживание от чёрного хода, — закрытый
# перечень того, что можно сделать.
#
# Каждое действие идёт в журнал приложения так же, как если бы его сделал
# человек за консолью: контейнер тот же, код тот же.
name: Обслуживание

on:
  # Раз в месяц — проверка восстановимости копии базы (решение заказчика
  # 2026-09-26). «Снимок без проверки восстановлением — это не резервная
  # копия, а надежда» (docs/DEPLOY.md); руками её не прогоняли ни разу, а
  # выкатка v1.11.1 показала, что снимок может молча встать. Расписанием
  # запускается только она — остальное в перечне по-прежнему руками.
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch:
    inputs:
      action:
        description: "Что сделать на сервере"
        required: true
        type: choice
        options:
          - catalog-install
          - demo-fill
          - demo-purge
          - rls-check
          - audit-verify
          - leftovers
          - logs-web
          - logs-api
          - backup-verify
          - backup-status
          - offsite-status
          - slots-resync
          - catalog-status
          - catalog-force
      count:
        description: "Сколько вымышленных людей завести (только для demo-fill), от 1 до 500"
        required: false
        default: "120"
      keys:
        description: "Ключи методик каталога через запятую (только для catalog-force), например who5"
        required: false
        default: ""

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      # Входные поля — до первого ssh (#154). Прежде count не проверялся
      # вовсе и ложился в текст удалённой команды как есть: «120; что
      # угодно» исполнялось на сервере, и закрытый перечень действий
      # переставал быть границей — в том числе для держателя
      # GITHUB_DISPATCH_TOKEN, которому задумано одно право. keys
      # проверялся, но уже после того, как ssh открыт. Теперь отказ — здесь,
      # без единого соединения с сервером; дальше идут только проверенные
      # значения (выходы этого шага), а не поля как есть.
      - name: Проверка входа
        id: input
        env:
          ACTION: ${{ inputs.action || 'backup-verify' }}
          COUNT: ${{ inputs.count }}
          KEYS: ${{ inputs.keys }}
        run: |
          case "$ACTION" in
            catalog-install|demo-fill|demo-purge|rls-check|audit-verify|leftovers|logs-web|logs-api|backup-verify|backup-status|offsite-status|slots-resync|catalog-status|catalog-force) ;;
            *) echo "неизвестное действие: $ACTION" >&2; exit 1 ;;
          esac
          # count — только цифры, от 1 до 500 (предел demoFill.ts); пусто — 120.
          # Проверяется при любом действии: непроверенное поле не должно
          # доезжать даже туда, где оно сейчас не нужно.
          checked_count="${COUNT:-120}"
          if ! [[ "$checked_count" =~ ^[1-9][0-9]{0,2}$ ]] || [ "$checked_count" -gt 500 ]; then
            echo "count: целое число от 1 до 500 — получено: $COUNT" >&2
            exit 1
          fi
          # keys — только для catalog-force: строчные буквы, цифры, «_», «-» и
          # запятые, первым — буква или цифра (не ключ командной строки)
          checked_keys=""
          if [ "$ACTION" = "catalog-force" ]; then
            if ! [[ "$KEYS" =~ ^[a-z0-9][a-z0-9_,-]{0,199}$ ]]; then
              echo "ключи: буквы, цифры, запятые — получено: $KEYS" >&2
              exit 1
            fi
            checked_keys="$KEYS"
          fi
          {
            echo "action=$ACTION"
            echo "count=$checked_count"
            echo "keys=$checked_keys"
          } >> "$GITHUB_OUTPUT"

      # Скрипты копий с сервера не берутся: выкатка привозит туда только
      # docker-compose.yml, и scripts/ на сервере — копия со дня настройки
      # (первый прогон проверки 2026-09-26 шёл старой версией). Проверка
      # запускается свежей версией из хранилища.
      - uses: actions/checkout@v4
      - name: Ключ доступа
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          # Одно соединение на весь прогон. Порт 22 сервера забит перебором
          # паролей, и sshd сбрасывает каждое новое подключение сверх
          # MaxStartups: так упала выкатка v1.16.2 на пятом ssh подряд. Все
          # ssh и scp ниже ходят через этот канал; открывается он с повторами.
          cat > ~/.ssh/config <<'CFG'
          Host *
            ControlMaster auto
            ControlPath ~/.ssh/cm-%C
            ControlPersist 20m
            ConnectTimeout 20
            ServerAliveInterval 30
          CFG
          chmod 600 ~/.ssh/config
          for i in 1 2 3 4 5 6; do
            ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" true && break
            [ "$i" = 6 ] && { echo "сервер не принял ssh за шесть попыток" >&2; exit 1; }
            echo "ssh не прошёл (попытка $i) — пауза"; sleep $((i * 10))
          done

      - name: Выполнить
        env:
          # проверенные шагом «Проверка входа», а не поля как есть; у запуска
          # по расписанию входных полей нет — это проверка копии
          ACTION: ${{ steps.input.outputs.action }}
          COUNT: ${{ steps.input.outputs.count }}
          KEYS: ${{ steps.input.outputs.keys }}
        run: |
          # команда собирается ЗДЕСЬ, из выбранного действия, а не приходит
          # строкой снаружи: иначе перечень действий ничего не ограничивает.
          # Числа и ключи ещё раз сверяются с образцом прямо перед тем, как
          # лечь в команду: проверка в соседнем шаге не должна быть
          # единственной стеной между полем формы и сервером.
          case "$ACTION" in
            catalog-install) CMD="bun apps/api/src/installCatalog.ts" ;;
            demo-fill)
              if ! [[ "$COUNT" =~ ^[1-9][0-9]{0,2}$ ]] || [ "$COUNT" -gt 500 ]; then
                echo "count не прошёл проверку: $COUNT"; exit 1
              fi
              CMD="bun apps/api/src/demoFill.ts $COUNT" ;;
            demo-purge)      CMD="bun apps/api/src/demoFill.ts purge" ;;
            rls-check)       CMD="bun apps/api/src/rlsReport.ts" ;;
            audit-verify)    CMD="bun apps/api/src/auditReport.ts" ;;
            # перепись таблиц от снятых возможностей: только чтение, ничего
            # не удаляет — решение по ним принимает человек, см. leftovers.ts
            leftovers)       CMD="bun apps/api/src/leftovers.ts" ;;
            # пересборка сетки слотов всем специалистам — то же, что фоновая
            # задача slots.horizon раз в сутки; нужна после миграции правил
            # сетки или восстановления из копии, см. slotsResync.ts
            slots-resync)    CMD="bun apps/api/src/slotsResync.ts" ;;
            # обзор каталога перед решением: что стоит и чьи последние версии
            catalog-status)  CMD="bun apps/api/src/installCatalog.ts --status" ;;
            # редакция каталога поверх правки учреждения — только названные
            # ключи, и только буквы, цифры, запятые: строка снаружи не должна
            # стать куском команды
            catalog-force)
              [[ "$KEYS" =~ ^[a-z0-9][a-z0-9_,-]{0,199}$ ]] || { echo "ключи: буквы, цифры, запятые — получено: $KEYS"; exit 1; }
              CMD="bun apps/api/src/installCatalog.ts --force $KEYS" ;;
            # чтение журналов службы — не запуск кода: отдельная ветка, где
            # выполняется docker compose logs, а не команда внутри контейнера
            logs-web|logs-api)
              SVC="${ACTION#logs-}"
              ssh -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
                "cd ${{ secrets.VPS_PATH }} && docker compose --env-file .env.docker logs --tail 120 $SVC"
              exit 0 ;;
            # Копии базы — на хосте, а не в контейнере api: снимок снимает
            # служба quizzy-backup (systemd), и адрес базы, каталог копий и
            # парольная фраза лежат в ЕЁ окружении. Отсюда их и берём, а не
            # заводим второй список тех же значений в секретах: два места
            # однажды разойдутся. Значения в журнал прогона не печатаются —
            # скрипты выводят только итог.
            backup-verify|backup-status|offsite-status)
              ssh -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "mkdir -p /tmp/quizzy-verify"
              scp -i ~/.ssh/id_ed25519 scripts/verify-backup.sh scripts/restore.sh scripts/offsite.sh \
                "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/quizzy-verify/"
              ssh -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
                "ACTION='$ACTION' TARGET='${{ secrets.VPS_PATH }}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$TARGET"
          set -a
          for f in $(systemctl show quizzy-backup.service -p EnvironmentFiles --value | awk '{print $1}'); do
            [ -r "$f" ] && . "$f"
          done
          # systemd берёт в кавычки значения с пробелами (PG_EXEC — это
          # «docker compose … exec -T postgres»): разбор — оболочкой, в массив
          eval "unit_env=( $(systemctl show quizzy-backup.service -p Environment --value) )"
          for kv in "${unit_env[@]}"; do export "$kv"; done
          set +a
          # внешняя копия: каждая местная есть снаружи и того же размера.
          # Скрипт из хранилища, как и проверка восстановимости; ключи — из
          # окружения службы, в журнал прогона не печатаются.
          if [ "$ACTION" = "offsite-status" ]; then
            trap 'rm -rf /tmp/quizzy-verify' EXIT
            bash /tmp/quizzy-verify/offsite.sh check </dev/null
            exit $?
          fi
          if [ "$ACTION" = "backup-status" ]; then
            systemctl status quizzy-backup.service --no-pager -n 0 | sed -n '1,4p' || true
            # что служба делала в последний раз — без этого «прошла, а файла нет» не разобрать
            echo "журнал службы:"
            journalctl -u quizzy-backup.service -n 25 --no-pager -o cat 2>/dev/null | sed 's/^/  /' || echo "  журнал недоступен"
            echo "каталоги копий:"
            ls -la "${BACKUP_DIR:?}" 2>/dev/null | sed 's/^/  /' || true
            echo "последние копии:"
            ls -1t "${BACKUP_DIR:?каталог копий не найден в окружении службы}"/daily/ 2>/dev/null | head -5 || echo "  нет суточных копий"
            exit 0
          fi
          trap 'rm -rf /tmp/quizzy-verify' EXIT
          # </dev/null: скрипт пришёл через stdin, и всё, что читает stdin внутри
          # проверки (compose exec), не должно дотянуться до него
          bash /tmp/quizzy-verify/verify-backup.sh </dev/null
          REMOTE
              exit 0 ;;
            *) echo "неизвестное действие: $ACTION"; exit 1 ;;
          esac
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd ${{ secrets.VPS_PATH }} && docker compose --env-file .env.docker run --rm --no-deps api $CMD"
