# Metro (React Native) не умеет резолвить изолированную раскладку node_modules,
# поэтому держим общий hoisted-node_modules в корне монорепо.
[install]
linker = "hoisted"

# Тестовое окружение готовится до загрузки тестовых файлов: иначе модуль db
# запоминает адрес рабочей базы при первом импорте приложения.
[test]
preload = ["./apps/api/test/preload.ts"]
