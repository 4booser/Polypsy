# Metro (React Native) не умеет резолвить изолированную раскладку node_modules,
# поэтому держим общий hoisted-node_modules в корне монорепо.
[install]
linker = "hoisted"

# Тестовое окружение готовится до загрузки тестовых файлов: иначе модуль db
# запоминает адрес рабочей базы при первом импорте приложения.
[test]
# Хранилище мобилки подменяется до линковки графа модулей: bun разбирает все
# статические импорты раньше выполнения, а react-native написан на Flow и в
# тестовом процессе не парсится вовсе.
preload = ["./apps/api/test/preload.ts", "./apps/mobile/test/store.mock.ts"]
